<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ficha do Animal</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topo">

    <h1>
        📋 Ficha do animal
    </h1>

</header>


<main class="dashboard">

    <div
        id="fichaAnimal"
        class="ficha"
    ></div>


    <div class="barra-acoes">

        <button onclick="editarAnimal()">
            ✏️ Editar
        </button>

        <button
            onclick="excluirAnimal()"
            class="botao-perigo"
        >
            🗑️ Excluir
        </button>

        <button onclick="voltarGado()">
            ← Voltar
        </button>

    </div>

</main>


<script src="script.js"></script>

</body>

</html>
