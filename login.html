<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login -AgroNexo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="tela-login">

    <main class="login-container">

        <div class="login-logo">
            🐂
        </div>

        <h1>AgroNexo</h1>

        <p class="login-subtitulo">
            Controle da sua fazenda
        </p>

        <form id="formLogin">

            <div class="campo">
                <label>Usuário</label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Digite o usuário"
                    required
                >
            </div>

            <div class="campo">
                <label>Senha</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite a senha"
                    required
                >
            </div>

            <button type="submit">
                🔐 Entrar
            </button>

        </form>

        <p class="login-info">
            Fazenda Control
        </p>

    </main>

    <script src="script.js"></script>

</body>

</html>
