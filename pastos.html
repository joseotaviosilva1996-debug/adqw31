<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pastos</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topo">

    <div>

        <h1>
            🌱 Pastos
        </h1>

        <p>
            Controle das áreas
        </p>

    </div>

    <button
        class="botao-sair"
        onclick="sair()"
    >
        🚪 Sair
    </button>

</header>


<main class="dashboard">


    <section class="painel">

        <h2>
            ➕ Cadastrar pasto
        </h2>


        <form id="formPasto">


            <div class="campo">

                <label>
                    Nome do pasto *
                </label>

                <input
                    type="text"
                    id="nomePasto"
                    placeholder="Ex: Pasto 01"
                    required
                >

            </div>


            <div class="campo">

                <label>
                    Área em hectares
                </label>

                <input
                    type="number"
                    id="areaPasto"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="campo">

                <label>
                    Capacidade de animais
                </label>

                <input
                    type="number"
                    id="capacidadePasto"
                    min="0"
                >

            </div>


            <div class="campo">

                <label>
                    Observações
                </label>

                <textarea
                    id="observacoesPasto"
                    rows="4"
                ></textarea>

            </div>


            <button type="submit">
                🌱 Salvar pasto
            </button>

        </form>

    </section>


    <h2>
        🌱 Pastos cadastrados
    </h2>


    <div id="listaPastos"></div>


    <button onclick="voltarInicio()">
        🏠 Início
    </button>


</main>


<script src="script.js"></script>

</body>

</html>
